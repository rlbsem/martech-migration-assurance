[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "martech-migration-assurance"
version = "1.0.0"
description = "Executable semantic reconciliation and reversible customer-platform migration"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.package-data]
migration_lab = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 115
target-version = "py312"
