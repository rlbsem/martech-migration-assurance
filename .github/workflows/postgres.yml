name: Native PostgreSQL CDC acceptance
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: native-cdc-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MIGRATION_PG_ADMIN_DSN: host=127.0.0.1 port=55451 user=postgres dbname=postgres
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: |
          python -m pip install -r requirements-postgres.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Start isolated loopback PostgreSQL with native logical replication
        run: |
          docker run -d --name native-cdc-postgres -p 127.0.0.1:55451:55451 -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17.11 -p 55451 -c wal_level=logical -c max_replication_slots=10 -c max_wal_senders=10 -c max_slot_wal_keep_size=256MB
          for attempt in $(seq 1 60); do
            if docker exec native-cdc-postgres pg_isready -p 55451 -U postgres -d postgres; then break; fi
            sleep 1
          done
          docker exec native-cdc-postgres pg_isready -p 55451 -U postgres -d postgres
      - run: python scripts/validate_native_repo.py
      - run: python scripts/verify_native.py --workspace work/native-private --output work/native-proof
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-postgres-proof-linux
          path: work/native-proof
          if-no-files-found: warn
      - if: always()
        run: docker rm -f native-cdc-postgres
  native-container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MIGRATION_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Execute installed wheel and native acceptance inside application container
        run: docker compose -f compose.postgres.yml -p native-cdc-${{ github.run_id }} run --build --rm verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-postgres-proof-container
          path: work/container-proof
          if-no-files-found: warn
      - if: always()
        run: docker compose -f compose.postgres.yml -p native-cdc-${{ github.run_id }} down --volumes
      - name: Independently check container and volume cleanup
        if: always()
        run: |
          test -z "$(docker ps -aq --filter label=com.docker.compose.project=native-cdc-${{ github.run_id }})"
          test -z "$(docker volume ls -q --filter label=com.docker.compose.project=native-cdc-${{ github.run_id }})"
